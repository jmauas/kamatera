<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f1ef">
  <title>Servidor EstudioMQ</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Íconos (sprite SVG) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.3L3 16M3 21v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <!-- Panel -->
  <div id="panel" class="wrap">
    <header class="top">
      <h1>Servidor</h1>
    </header>

    <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

    <section class="card" aria-labelledby="tEstado">
      <h2 id="tEstado" class="sr-only">Estado del servidor</h2>
      <div class="estado-fila">
        <div>
          <p class="muted">Nombre</p>
          <p class="valor" id="nombre">—</p>
        </div>
        <div id="estado" class="badge badge--neutral" aria-live="polite">Consultando…</div>
      </div>
      <dl class="specs">
        <div><dt>Procesadores</dt><dd id="cant">—</dd></div>
        <div><dt>Memoria</dt><dd id="memoria">—</dd></div>
        <div><dt>Disco SSD</dt><dd id="ssd">—</dd></div>
        <div><dt>Dirección IP</dt><dd id="ip">—</dd></div>
      </dl>
      <p class="muted small" id="actualizado"></p>
    </section>

    <section class="acciones" aria-label="Acciones">
      <button class="btn btn--ok" id="encender" type="button"><svg class="ico"><use href="#i-power"/></svg>Encender</button>
      <button class="btn btn--danger" id="apagar" type="button"><svg class="ico"><use href="#i-power"/></svg>Apagar</button>
      <button class="btn btn--warn" id="reiniciar" type="button"><svg class="ico"><use href="#i-restart"/></svg>Reiniciar</button>
      <button class="btn btn--neutral" id="actualizar" type="button"><svg class="ico"><use href="#i-refresh"/></svg>Actualizar</button>
    </section>

    <button class="btn btn--neutral btn--sm" id="btnMostrarConfig" type="button" aria-expanded="false" aria-controls="configDiv">
      <svg class="ico"><use href="#i-cog"/></svg><span id="txtConfig">Configuración</span>
    </button>

    <section class="card" id="configDiv" hidden aria-labelledby="tConfig">
      <h2 id="tConfig">Configuración del servidor</h2>
      <p class="warning">Usar con precaución: cada cambio reinicia el servidor.</p>

      <div class="cfg">
        <label class="field" for="procesadores">Procesadores</label>
        <div class="cfg__fila">
          <select id="procesadores"></select>
          <button class="btn btn--primary" id="aplicarProc" type="button">Aplicar</button>
        </div>
      </div>
      <div class="cfg">
        <label class="field" for="memoriaRam">Memoria RAM</label>
        <div class="cfg__fila">
          <select id="memoriaRam"></select>
          <button class="btn btn--primary" id="aplicarRam" type="button">Aplicar</button>
        </div>
      </div>
      <div class="cfg">
        <label class="field" for="disco">Disco SSD (no se puede reducir después)</label>
        <div class="cfg__fila">
          <select id="disco"></select>
          <button class="btn btn--primary" id="aplicarSsd" type="button">Aplicar</button>
        </div>
      </div>
    </section>

    <section aria-labelledby="tTareas">
      <h2 id="tTareas">Tareas</h2>
      <div class="tabla-wrap">
        <table class="tabla">
          <thead><tr><th>Fecha</th><th>Tarea</th><th>Estado</th></tr></thead>
          <tbody id="tareas"></tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="tRegistro">
      <h2 id="tRegistro">Registro</h2>
      <div class="tabla-wrap">
        <table class="tabla">
          <thead><tr><th>Fecha</th><th>Acción</th><th>Quién</th><th>Resultado</th></tr></thead>
          <tbody id="registro"></tbody>
        </table>
      </div>
      <button class="btn btn--neutral btn--sm" id="verMas" type="button" hidden>Ver más registros</button>
    </section>
  </div>

  <!-- Diálogo genérico (confirmaciones y formularios) -->
  <dialog id="dlg" aria-labelledby="dlgTitulo">
    <form id="dlgForm" method="dialog" autocomplete="off">
      <h2 id="dlgTitulo"></h2>
      <p id="dlgMensaje" class="dlg__msg"></p>
      <div id="dlgCampos"></div>
      <div class="dlg__acciones">
        <button class="btn btn--neutral" id="dlgCancel" type="button"><svg class="ico"><use href="#i-x"/></svg>Cancelar</button>
        <button class="btn btn--primary" id="dlgOk" type="submit"></button>
      </div>
    </form>
  </dialog>

  <!-- Progreso del apagado -->
  <dialog id="prog" aria-labelledby="progTitulo">
    <h2 id="progTitulo"></h2>
    <p id="progAviso" class="muted small">Dejá esta pestaña abierta hasta que termine.</p>
    <ol id="progPasos" class="pasos"></ol>
    <p id="progResumen" class="prog__resumen" role="status" aria-live="polite"></p>
    <div class="dlg__acciones">
      <button class="btn btn--neutral" id="progCerrar" type="button" hidden>Cerrar</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/index.js"></script>
</body>
</html>
